defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true

# SR3R is opt-in so the original NAS3R-M 64-in/64-supervision path remains
# available unchanged.
sr3r:
  enabled: false
  upscale: 4
  swinir_weight_path: /space0/mengxl/NAS3R-master/pretrained_weights/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth
  encoder_dim: 1024
  decoder_dim: 768
  token_heads: 8
  token_dropout: 0.0
  shuffle_beta: 0.5
  shuffle_axis_divisor: 4.0
  shuffle_lateral_divisor: 1.9
  shuffle_opacity_threshold: 0.5
  apply_shuffle_opacity_threshold: false
  ptv3_channels: 768
  ptv3_depth: 4
  ptv3_heads: 8
  ptv3_patch_size: 1024
  ptv3_mlp_ratio: 4.0
  ptv3_enable_flash: true
  ptv3_grid_depth: 15
  debug_interval: 500
