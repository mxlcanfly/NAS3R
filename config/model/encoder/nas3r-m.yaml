defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""
backbone_input_sr:
  mode: none  # none | hat | asteisr
  source: image  # image: original 256 input; image_lr: 64 input for HAT/ASteISR; auto: old image_lr-first behavior.
  lr_shape: [64, 64]
  target_shape: [256, 256]
  hat_weight_path: /space0/mengxl/pth/HAT-L_SRx4_ImageNet-pretrain.pth
  asteisr_weight_path: /space0/mengxl/pth/ASteISR_X4.pth
  hat_root: /space0/mengxl/HAT
  asteisr_root: /space0/mengxl/ASteISR-main

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true

trainable:
  backbone: true
  depth_heads: true
  gs_heads: true
  pose_heads: true
  gaussian_adapter: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true
