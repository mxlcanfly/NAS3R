defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true

# Trainability switches for NAS3R-M modules. The original network is frozen by
# default; newly added feature heads remain trainable.
trainable:
  backbone: false
  depth_heads: false
  gs_heads: false
  pose_heads: false
  gaussian_adapter: false
  feature_heads: true
  feature_fusion: true
  enhanced_feature_fusion: true
  hr_gaussian_head: true

feature_fusion:
  image_feature_dim: 64
  embed_dim: 180
  output_dim: 256
  num_rstb: 3
  depth: 6
  num_heads: 6
  window_size: 8
  mlp_ratio: 2.0
  projection_kernel_size: 1
  upsample_scale: 4
  upsample_num_feat: 256
  use_checkpoint: true
  mvca_num_heads: 6
  mvca_patch_size: 3
  mvca_depth_tolerance: 0.1
  mvca_query_chunk_size: 256
  mvca_residual_init: 0.0

enhanced_feature_fusion:
  gs_feature_dim: 256
  encoder_feature_dim: 256
  output_dim: 256
  num_groups: 32

hr_gaussian_head:
  hidden_dim: 256
  depth_head_layers: 2
  gaussian_head_layers: 4


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true
