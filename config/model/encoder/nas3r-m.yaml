defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true

use_swinir: true
swinir_weights: /space0/mengxl/NAS3R-master/pretrained_weights/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth
swinir_upscale: 4
swinir_input_size: 64
use_resunet_token_fusion: true
unimatch_weights_path: /space0/mengxl/NAS3R-master/pretrained_weights/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth
use_image_only_feature_consistency: true
image_only_consistency_patch_size: 1
image_only_consistency_depth_relative_tolerance: 0.1
use_anchor_multiview_feature_aggregation: true
anchor_feature_occlusion_tau: 10.0
anchor_feature_similarity_beta: 1.0
anchor_feature_eps: 1e-6
anchor_feature_patch_size: 8
use_point_offset_decoder: true
point_offset_hidden_dim: 128
point_offset_depth: 2
point_offset_num_heads: 8
point_offset_patch_size: 48
point_offset_k: 8
point_offset_grid_size: 0.01
point_offset_scale: 0.5
use_child_gaussian_residual: true
child_feature_patch_size: 2
child_gaussian_hidden_dim: 256
child_gaussian_fourier_frequencies: 6
child_gaussian_enable_absolute_pe: true
child_scale_divisor: 2.0
