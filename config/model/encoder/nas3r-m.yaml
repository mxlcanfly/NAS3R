defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true

use_swinir: true
swinir_weights: /space0/mengxl/NAS3R-master/pretrained_weights/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth
swinir_upscale: 4
swinir_input_size: 64

compute_render_error: true
render_error_background: [0.0, 0.0, 0.0]

use_resunet_token_fusion: true
unimatch_weights_path: /space0/mengxl/NAS3R-master/pretrained_weights/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth

use_multiview_physical_conditions: true
consistency_patch_size: 1
gaussian_transmittance_chunk_size: 256
gaussian_transmittance_min_pixel_std: 0.3
occlusion_delta_scale: 0.1

use_conditional_densifier: true
densifier_attention_dim: 128
densifier_attention_heads: 8
densifier_num_slots: 16
densifier_slot_dim: 32
densifier_hidden_dim: 256
densifier_use_full_litept: true
densifier_litept_path: /space0/mengxl/LitePT-main
densifier_litept_grid_size: 0.02

densification_grid_size: 64
# Number of LR Gaussian positions selected independently in each input view.
densification_budget: 4096
densification_sampling: all
