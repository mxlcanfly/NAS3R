defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true

use_swinir_sr: true
swinir_weight_path: /space0/mengxl/NAS3R-master/pretrained_weights/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth

entropy_num_gray_levels: 256
entropy_window_size: 9
entropy_points_per_view: 16384

multiview_patch_size: 2
multiview_depth_tolerance: 0.05

geometry_num_frequencies: 6
geometry_dim: 128
visual_feature_dim: 256
intrinsic_feature_dim: 64
point_type_dim: 16

litept_token_dim: 512
gaussian_refiner_hidden_dim: 512

# GaussianLens-style pixel Gaussians start from isotropic covariance, constant
# opacity, and the RGB value of their sampled SR pixel.
sr_initial_opacity: 0.05
sr_initial_covariance: 0.02
