defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true

# One-step ReSplat refinement.  The original NAS3R-M 256x256 network is
# frozen; only these newly introduced refinement modules are trainable.
refine_enabled: true
refine_channels: 512
refine_knn_samples: 8
refine_point_blocks: 4
refine_knn_projection_channels: 64
refine_scale_min: 1.0e-6
refine_pt_chunk_size: 32768

error_lifting:
  feature_dim: 256
  chunk_size: 32
  max_probe_channels: 34
  contribution_eps: 1.0e-8
