defaults:
  - backbone: masked_croco_multi

name: nas3r-m

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

gs_params_head_type: dpt_gs
pose_free: true
pretrained_weights: ""

pose_make_baseline_1: false
pose_make_relative: true
pose_head_type: mlp


estimating_focal: false
estimating_pose: true


pose_head:
  pose_init_t: false
  use_homogeneous: false
  concat_enc: false
  estimate_focal: true


depth_activation: 'sigmoid'

equal_fxfy: true
equal_view_intrinsics: true

sr_branch:
  enabled: true
  weight_path: "/space0/mengxl/NAS3R-master/pretrained_weights/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth"
  upscale: 4
  img_size: 64
  window_size: 8
  freeze_lr_branch: true
  share_lr_backbone: false
  output_key: sr_tokens
  encoder_feature_output_key: sr_fusion_dpt_feature
  anchor_sampler_enabled: true
  anchor_sampler_patch_size: 4
  anchor_sampler_padding_mode: border
  anchor_sampler_output_key: lr_anchor_sr_features
  anchor_render_background_color: [0.0, 0.0, 0.0]
  anchor_render_scale_invariant: true
  gd_densifier:
    enabled: true
    lr_gs_feature_dim: 256
    # (8 stack channels + 1 z_diff) * 4x4 patch = 144
    sampled_feature_dim: 144
    hidden_dim: 160
    cross_attn_heads: 16
    point_depth: 2
    point_heads: 8
    point_patch_size: 48
    point_mlp_ratio: 4.0
    num_offsets: 16
    offset_init_radius_scale: 0.5
    # child offsets are norm-bounded by the sphere inscribed in the anchor's
    # own-view LR pixel frustum; 0.5 = offsets can reach the pixel cell border
    offset_pixel_radius_scale: 0.5
    offset_init_pattern: sphere
    offset_coordinate_frame: world
  child_gaussian_decoder:
    enabled: true
    sr_feature_dim: 256
    hidden_dim: 256
    self_attn_layers: 4
    self_attn_heads: 8
    group_norm_groups: 16
    center_fourier_frequencies: 6
    center_fourier_scale: 1.0
    child_scale_divisor: 2.0
    clamp_min_scale: 1e-6
    clamp_max_scale: 0.3
