# @package _global_

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: nas3r-m
  - override /model/encoder/backbone: masked_croco_multi
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  name: re10k
  tags: [re10k, 256x256]
  project: nas3r-m


model:
  encoder:
    backbone:
      name: masked_croco_multi
      intrinsics_embed_loc: 'decoder'

    gs_params_head_type: dpt_gs
    pose_free: true
    pretrained_weights: "/space0/mengxl/NAS3R-master/outputs/exp_re10k/64in64/checkpoints/epoch_36-step_300000.ckpt"#"/space0/mengxl/NAS3R-master/pretrained_weights/naslr.ckpt" # "/space0/mengxl/NAS3R-master/pretrained_weights/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"


    estimating_focal: false 
    depth_activation: 'sigmoid'

    pose_head:
      pose_init_t: true
      use_homogeneous: false
      concat_enc: false
      estimate_focal: false



dataset:
  re10k:
    make_baseline_1: true
    view_sampler:
      warm_up_steps: 10000
      num_target_views: 1
      num_context_views: 2
      max_distance_between_context_views: 150


optimizer:
  lr: 1e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 1.0
  min_lr_multiplier: 0.0

data_loader:
  train:
    batch_size: 16

trainer:
  max_steps: 75000
  val_check_interval: 10000

checkpointing:
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 1


train:
  training_context: false
  refine_only: true
  depth_consistency_weight: 0.1
  debug_save_every_n_steps: 500


test:
  output_path: outputs/test/nas3r-m/pretrained-I/
  align_pose: false
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
