# @package _global_

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: nas3r-m
  - override /model/encoder/backbone: masked_croco_multi
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  name: re10k
  tags: [re10k, 256x256]
  project: nas3r-m


model:
  encoder:
    backbone:
      name: masked_croco_multi
      intrinsics_embed_loc: 'decoder'

    gs_params_head_type: dpt_gs
    pose_free: true
    pretrained_weights: "/space0/mengxl/NAS3R-master/pretrained_weights/re10k_nas3r-m_pretrained-I.ckpt"


    estimating_focal: false
    depth_activation: 'sigmoid'
    use_resunet_feature_extractor: true
    use_context_render_error: true

    pose_head:
      pose_init_t: true
      use_homogeneous: false
      concat_enc: false
      estimate_focal: false



dataset:
  re10k:
    make_baseline_1: true
    view_sampler:
      warm_up_steps: 10000
      num_target_views: 1
      num_context_views: 2
      max_distance_between_context_views: 150


optimizer:
  lr: 1e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 1.0
  min_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 6

trainer:
  max_steps: 75001
  val_check_interval: 10000

checkpointing:
  every_n_train_steps: 1000
  save_weights_only: false
  save_top_k: 1
  resume_from_latest: false


train:
  training_context: false
  debug_save_every_n_steps: 500
  freeze_backbone: true
  freeze_depth_head: true
  freeze_gaussian_param_head: true
  freeze_pose_head: true


test:
  output_path: outputs/test/nas3r-m/pretrained-I/
  align_pose: false
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
