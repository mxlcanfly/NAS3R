# @package _global_

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: nas3r-m
  - override /model/encoder/backbone: masked_croco_multi
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips]

wandb:
  name: re10k_refine
  tags: [re10k, 256x256, resplat_refine]
  project: nas3r-m


model:
  encoder:
    backbone:
      name: masked_croco_multi
      intrinsics_embed_loc: 'decoder'

    gs_params_head_type: dpt_gs
    pose_free: true
    # Load only the encoder weights from the completed 150k-step Lightning
    # checkpoint. This starts a fresh stage-two optimizer/global step.
    pretrained_weights: "/space0/mengxl/NAS3R-master/outputs/exp_re10k/up64in256/checkpoints/epoch_18-step_150000.ckpt"
    freeze_base_for_refine: true
    gaussian_refiner:
      enabled: true
      channels: 512
      knn_samples: 8
      num_blocks: 4
      attn_proj_channels: 64
      use_checkpointing: true
      scale_min: 1.0e-6
      scale_max: 0.3


    estimating_focal: false
    depth_activation: 'sigmoid'

    pose_head:
      pose_init_t: true
      use_homogeneous: false
      concat_enc: false
      estimate_focal: false



dataset:
  re10k:
    make_baseline_1: true
    view_sampler:
      warm_up_steps: 75_000
      num_target_views: 1
      num_context_views: 2
      max_distance_between_context_views: 150


optimizer:
  lr: 1e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  min_lr_multiplier: 0.01

data_loader:
  train:
    # 2 * 256 * 256 points with KNN attention is memory intensive.
    batch_size: 4

trainer:
  max_steps: 75_001
  val_check_interval: 2500

checkpointing:
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 1


train:
  training_context: false


test:
  output_path: outputs/test/nas3r-m/pretrained-I/
  align_pose: false
  compute_scores: true
  save_image: true
  save_video: false
  save_compare: false
